<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan Casey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --grad-start:#4A5FD9;
    --grad-mid:#7B6FE0;
    --grad-end:#D89FD6;
    --card-bg:rgba(255,255,255,0.08);
    --card-border:rgba(255,255,255,0.14);
    --text:#FFFFFF;
    --text-soft:rgba(255,255,255,0.72);
    --text-faint:rgba(255,255,255,0.55);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:linear-gradient(135deg, var(--grad-start) 0%, var(--grad-mid) 55%, var(--grad-end) 100%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:80px 24px 40px;
    text-align:center;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:28px;
    padding:56px 40px 44px;
    backdrop-filter:blur(6px);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .avatar-wrap{
    position:relative;
    width:170px;
    height:170px;
    margin-bottom:28px;
  }
  .avatar{
    width:150px;
    height:150px;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    overflow:hidden;
    position:absolute;
    top:10px;
    left:10px;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .avatar-decoration{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
    z-index:1;
    pointer-events:none;
  }

  h1{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(40px,7vw,56px);
    line-height:1.05;
    margin-bottom:14px;
  }

  .role{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:19px;
    color:var(--text-soft);
  }

  .subline{
    margin-top:36px;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    letter-spacing:0.04em;
    color:var(--text-faint);
  }

  footer{
    width:100%;
    padding:28px 24px 32px;
    border-top:1px solid rgba(255,255,255,0.12);
  }
  .footer-inner{
    max-width:720px;
    margin:0 auto;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:8px 28px;
  }
  .footer-inner a{
    color:var(--text-soft);
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    letter-spacing:0.01em;
    transition:color 0.15s ease;
  }
  .footer-inner a:hover{
    color:var(--text);
  }
  .footer-dot{
    width:3px;height:3px;border-radius:50%;
    background:rgba(255,255,255,0.35);
  }
  .footer-copy{
    text-align:center;
    margin-top:16px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:rgba(255,255,255,0.4);
  }

  a:focus-visible, button:focus-visible{
    outline:2px solid #fff;
    outline-offset:3px;
  }

  @media (max-width:480px){
    .card{padding:44px 24px 36px;}
  }
</style>
</head>
<body>

<main>
  <div class="card">
    <div class="avatar-wrap">
      <img class="avatar-decoration" src="assets/dino.gif" alt="">
      <div class="avatar">
        <img src="assets/headshot.png" alt="Ryan Casey">
      </div>
    </div>

    <h1>Ryan Casey</h1>
    <div class="role">Product Designer</div>
  </div>

  <div class="subline">Selected Case Studies 2026</div>
</main>

<footer>
  <div class="footer-inner">
    <a href="#" target="_blank" rel="noopener">GitHub</a>
    <span class="footer-dot"></span>
    <a href="#" target="_blank" rel="noopener">LinkedIn</a>
    <span class="footer-dot"></span>
    <a href="#" target="_blank" rel="noopener">SoundCloud</a>
    <span class="footer-dot"></span>
    <a href="mailto:you@rdrew.com">Email</a>
  </div>
  <div class="footer-copy">rdrew.com &mdash; <span id="year"></span></div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
